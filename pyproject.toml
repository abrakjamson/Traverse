[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "traverse"
version = "0.5.0"
description = "Polite local MCP server for traversing and reading web knowledge sources"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "mcp>=1.29.1,<2",
    "pypdf>=5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
traverse = "wiki_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

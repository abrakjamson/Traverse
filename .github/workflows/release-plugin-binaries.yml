name: Release Traverse binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: traverse-windows-x64.exe
          - os: ubuntu-latest
            asset: traverse-linux-x64
          - os: macos-15-intel
            asset: traverse-macos-x64
          - os: macos-14
            asset: traverse-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        if: runner.os != 'Linux'
        run: python -m pip install . pyinstaller

      - name: Build standalone executable
        if: runner.os != 'Linux'
        shell: pwsh
        run: >-
          python -m PyInstaller
          --clean
          --noconfirm
          --onefile
          --name "${{ matrix.asset }}"
          --collect-all lxml
          --collect-all pypdf
          scripts/pyinstaller_entry.py

      - name: Build portable Linux executable
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            python:3.12-slim-bullseye \
            bash -c '
              apt-get update &&
              apt-get install --yes --no-install-recommends binutils &&
              python -m pip install . pyinstaller &&
              python -m PyInstaller \
                --clean \
                --noconfirm \
                --onefile \
                --name "${{ matrix.asset }}" \
                --collect-all lxml \
                --collect-all pypdf \
                scripts/pyinstaller_entry.py
            '

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create checksum manifest
        working-directory: release
        run: sha256sum traverse-* > SHA256SUMS

      - name: Add installer scripts
        run: cp scripts/install-traverse.ps1 scripts/install-traverse.sh release/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
